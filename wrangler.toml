# Cloudflare Worker for Tasteplot. One Worker serves the API (/api/*) and the
# built web app (dist/) through Workers Static Assets.
# Nothing here is deployed automatically. Deploy with scripts/publish.sh deploy --yes.
name = "tasteplot"
main = "src/worker.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
QLOO_BASE_URL = "https://hackathon.api.qloo.com"
LLM_PROVIDER = "scripted"
LLM_MODEL = "claude-opus-5-5"
LLM_MAX_TURNS = "24"
# Upstream Qloo calls per plan. The Workers Free plan allows 50 subrequests per
# request (UNVERIFIED for 2026, check the Cloudflare limits page). A 3-site brief
# with a compare metro and a second audience uses about 21 Qloo calls.
MAX_QLOO_CALLS = "48"
# Quota protection (src/server/quota.ts). The hackathon key allows 10,000 Qloo calls a
# month: 250 fresh calls a day x 31 = 7,750. Cached calls and sample plans are free.
DAILY_QLOO_CAP = "250"
# New (uncached) plans per IP address per hour.
PLANS_PER_HOUR = "10"

# Secrets (never in this file). Set them with:
#   npx wrangler secret put QLOO_API_KEY
#   npx wrangler secret put ANTHROPIC_API_KEY

# KV cache for Qloo responses and finished plans. Create it, then paste the id:
#   npx wrangler kv namespace create TASTEPLOT_CACHE
[[kv_namespaces]]
binding = "CACHE"
id = "b091df05745740199d438c5428314174"
